# Fase A — entrega de áudio .rib (origin Backblaze B2).
# Deploy: bash scripts/deploy-cf-audio-worker.sh
# Domínio alvo: cloud3.radioibiza.app.br (CNAME cloud3 no Registro.br após 1º deploy)

name = "radioibiza-audio-b2"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# Custom domain — criado no deploy (painel "Add Domain" pode falhar silenciosamente)
routes = [{ pattern = "cloud3.radioibiza.app.br", custom_domain = true }]

[vars]
B2_USO_PREFIX = "uso/"
B2_MASTER_PREFIX = "master/"
B2_REGION = "us-east-005"
# Origens CORS (vírgula). Inclui previews Netlify de homolog — não remover player5/portal.
CORS_ALLOWED_ORIGINS = "https://player5.radioibiza.app.br,https://portal.radioibiza.app.br,https://125lab--radio-ibiza-player5.netlify.app,https://ping-lab-0125--radio-ibiza-player5.netlify.app"

# Secrets via wrangler (não commitar):
#   wrangler secret put CRIACAO_INGEST_SECRET
#   wrangler secret put B2_ENDPOINT
#   wrangler secret put B2_BUCKET
#   wrangler secret put B2_KEY_ID
#   wrangler secret put B2_APPLICATION_KEY
