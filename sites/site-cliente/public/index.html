<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Radio Ibiza — Área do Cliente</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #312e81 50%, #581c87 100%);
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 1.25rem;
        padding: 2rem;
        backdrop-filter: blur(8px);
      }
      h1 { font-size: 1.35rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.25rem; color: rgba(255,255,255,0.75); line-height: 1.5; font-size: 0.95rem; }
      a.btn {
        display: inline-block;
        width: 100%;
        text-align: center;
        padding: 0.85rem 1rem;
        border-radius: 0.75rem;
        background: linear-gradient(90deg, #ec4899, #a855f7);
        color: white;
        text-decoration: none;
        font-weight: 600;
      }
      .muted { font-size: 0.75rem; color: rgba(255,255,255,0.45); margin-top: 1rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Radio Ibiza — Cliente</h1>
      <p>Painel do cliente: status dos PDVs, programação musical e feedback das lojas.</p>
      <a class="btn" href="/login.html">Entrar</a>
      <p class="muted">Acesso exclusivo para clientes Radio Ibiza.</p>
    </div>
    <script src="/auth.js"></script>
    <script src="/index.js"></script>
  </body>
</html>
