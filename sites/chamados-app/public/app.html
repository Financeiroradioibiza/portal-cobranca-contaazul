<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1565c0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="IbiZap" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>IbiZap — Chamados</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/chamados-icon-180.png" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <button type="button" id="btn-theme" class="icon-btn icon-btn-theme" aria-label="Tema">☀️</button>
        <div class="topbar-center">
          <img
            class="topbar-brand-logo"
            src="/ibizap-logo-header.png"
            alt="IbiZap"
            width="64"
            height="64"
            decoding="async"
          />
          <h1 id="screen-title" class="topbar-screen">Chamados</h1>
        </div>
        <button type="button" id="btn-logout" class="icon-btn" aria-label="Sair">⎋</button>
      </header>
      <div id="ptr" class="ptr" hidden aria-live="polite">
        <span class="ptr-spinner" aria-hidden="true"></span>
        <span id="ptr-label">Puxe para atualizar</span>
      </div>
      <div id="push-banner" class="push-banner" hidden role="region" aria-label="Notificações"></div>
      <div id="main" class="main" role="main"></div>
      <nav class="bottom-nav" id="bottom-nav">
        <button type="button" data-tab="tickets" class="nav-btn active">
          <span class="nav-emoji">📋</span>
          <span>Chamados</span>
        </button>
        <button type="button" data-tab="agenda" class="nav-btn">
          <span class="nav-emoji">📅</span>
          <span>Agenda</span>
        </button>
        <button type="button" data-tab="chat" class="nav-btn">
          <span class="nav-emoji">💬</span>
          <span>Chat</span>
        </button>
      </nav>
    </div>
    <div id="overlay" class="overlay" hidden></div>
    <script src="/auth.js?v=20260402"></script>
    <script src="/push.js?v=20260402"></script>
    <script src="/sequencia-defaults.js?v=20260402"></script>
    <script src="/sequencia-editor.js?v=20260402"></script>
    <script src="/agenda.js?v=20260402"></script>
    <script src="/app.js?v=20260402"></script>
  </body>
</html>
