<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1565c0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="IbiZap" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>IbiZap — Chamados</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/chamados-icon-180.png" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body>
    <div id="login-screen" class="wrap login-screen">
      <div class="brand">
        <img
          class="brand-logo"
          src="/ibizap-logo-login.png"
          alt="IbiZap"
          width="96"
          height="96"
          decoding="async"
        />
        <h1>Chamados</h1>
        <p class="sub">Kanban e chat da equipe</p>
      </div>
      <form id="login-form" class="card">
        <label>
          <span>E-mail</span>
          <input id="login-email" type="email" autocomplete="username" required />
        </label>
        <label>
          <span>Senha</span>
          <input id="login-password" type="password" autocomplete="current-password" required />
        </label>
        <label>
          <span>Código Authenticator</span>
          <input id="login-totp" inputmode="numeric" autocomplete="one-time-code" required maxlength="8" />
        </label>
        <p id="login-err" class="err" hidden></p>
        <button id="login-btn" type="submit">Entrar</button>
      </form>
    </div>
    <div id="app" class="app-shell" hidden>
      <header class="topbar">
        <button type="button" id="btn-theme" class="icon-btn icon-btn-theme" aria-label="Tema">☀️</button>
        <div class="topbar-center">
          <img
            class="topbar-brand-logo"
            src="/ibizap-logo-header.png"
            alt="IbiZap"
            width="64"
            height="64"
            decoding="async"
          />
          <h1 id="screen-title" class="topbar-screen">Chamados</h1>
        </div>
        <button type="button" id="btn-logout" class="icon-btn" aria-label="Sair">⎋</button>
      </header>
      <div id="ptr" class="ptr" hidden aria-live="polite">
        <span class="ptr-spinner" aria-hidden="true"></span>
        <span id="ptr-label">Puxe para atualizar</span>
      </div>
      <div id="push-banner" class="push-banner" hidden role="region" aria-label="Notificações"></div>
      <div id="main" class="main" role="main"></div>
      <nav class="bottom-nav" id="bottom-nav">
        <button type="button" data-tab="tickets" class="nav-btn active">
          <span class="nav-emoji">📋</span>
          <span>Chamados</span>
        </button>
        <button type="button" data-tab="agenda" class="nav-btn">
          <span class="nav-emoji">📅</span>
          <span>Agenda</span>
        </button>
        <button type="button" data-tab="chat" class="nav-btn">
          <span class="nav-emoji">💬</span>
          <span>Chat</span>
        </button>
      </nav>
    </div>
    <div id="overlay" class="overlay" hidden></div>
    <script src="/auth.js?v=20260402c"></script>
    <script src="/login-panel.js?v=20260402c"></script>
    <script src="/push.js?v=20260402c"></script>
    <script src="/sequencia-defaults.js?v=20260402c"></script>
    <script src="/sequencia-editor.js?v=20260402c"></script>
    <script src="/agenda.js?v=20260402c"></script>
    <script src="/app.js?v=20260402c"></script>
  </body>
</html>
