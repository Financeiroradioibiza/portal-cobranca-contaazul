<!DOCTYPE html>
<html lang="pt-BR" data-theme="ibiza">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6b21a8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="IbiZap" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>IbiZap — Chamados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/chamados-icon-180.png" />
    <script src="/theme.js?v=20260403d"></script>
    <link rel="stylesheet" href="/app.css?v=20260405a" />
    <link rel="stylesheet" href="/login.css?v=20260405a" />
    <style>
      body[data-auth-gate="app"] #login-screen,
      body[data-auth-gate="checking"] #login-screen {
        display: none !important;
      }
      body[data-auth-gate="login"] #app,
      body[data-auth-gate="checking"] #app {
        display: none !important;
      }
    </style>
  </head>
  <body data-auth-gate="checking">
    <div id="login-screen" class="login-screen">
      <div class="brand">
        <img
          class="brand-logo"
          src="/ibizap-logo-login.png"
          alt="IbiZap"
          width="96"
          height="96"
          decoding="async"
        />
        <h1>Chamados</h1>
        <p class="sub">Kanban e chat da equipe</p>
      </div>
      <form id="login-form" class="card">
        <label>
          <span>E-mail</span>
          <input id="login-email" type="email" autocomplete="username" required />
        </label>
        <label>
          <span>Senha</span>
          <input id="login-password" type="password" autocomplete="current-password" required />
        </label>
        <label>
          <span>Código Authenticator</span>
          <input id="login-totp" inputmode="numeric" autocomplete="one-time-code" required maxlength="8" />
        </label>
        <p id="login-err" class="err" hidden></p>
        <button id="login-btn" type="submit">Entrar</button>
      </form>
    </div>
    <div id="app" class="app-shell" hidden>
      <header class="topbar">
        <button type="button" id="btn-theme" class="icon-btn icon-btn-theme" aria-label="Tema">💜</button>
        <div class="topbar-center">
          <img
            class="topbar-brand-logo"
            src="/ibizap-logo-header.png"
            alt="IbiZap"
            width="64"
            height="64"
            decoding="async"
          />
          <h1 id="screen-title" class="topbar-screen">Chamados</h1>
        </div>
        <button type="button" id="btn-logout" class="icon-btn" aria-label="Sair">⎋</button>
      </header>
      <div id="ptr" class="ptr" hidden aria-live="polite">
        <span class="ptr-spinner" aria-hidden="true"></span>
        <span id="ptr-label">Puxe para atualizar</span>
      </div>
      <div id="push-banner" class="push-banner" hidden role="region" aria-label="Notificações"></div>
      <div id="main" class="main" role="main"></div>
      <nav class="bottom-nav ibiz-nav" id="bottom-nav">
        <button type="button" data-tab="tickets" class="nav-btn">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4h6v3H9zM9 12h6M9 16h4"></path></svg>
          <span>Chamados</span>
        </button>
        <button type="button" data-tab="agenda" class="nav-btn active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>
          <span>Agenda</span>
        </button>
        <button type="button" data-tab="chat" class="nav-btn">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"></path></svg>
          <span>Chat</span>
        </button>
      </nav>
    </div>
    <div id="overlay" class="overlay" hidden></div>
    <script src="/auth.js?v=20260405a"></script>
    <script src="/login-panel.js?v=20260405a"></script>
    <script src="/push.js?v=20260405a"></script>
    <script src="/sequencia-defaults.js?v=20260405a"></script>
    <script src="/sequencia-editor.js?v=20260405a"></script>
    <script src="/agenda.js?v=20260405a"></script>
    <script src="/app.js?v=20260405a"></script>
  </body>
</html>
