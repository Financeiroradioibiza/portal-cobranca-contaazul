<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c4146a" />
    <title>Entrar — Chamados</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/chamados-icon-180.png" />
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body>
    <main class="wrap">
      <div class="brand">
        <div class="logo">C</div>
        <h1>Chamados</h1>
        <p class="sub">Radio Ibiza · kanban e chat da equipe</p>
      </div>
      <form id="form" class="card">
        <label>
          <span>E-mail</span>
          <input id="email" type="email" autocomplete="username" required />
        </label>
        <label>
          <span>Senha</span>
          <input id="password" type="password" autocomplete="current-password" required />
        </label>
        <label>
          <span>Código Authenticator</span>
          <input id="totp" inputmode="numeric" autocomplete="one-time-code" required maxlength="8" />
        </label>
        <p id="err" class="err" hidden></p>
        <button id="btn" type="submit">Entrar</button>
      </form>
    </main>
    <script src="/auth.js"></script>
    <script src="/login.js"></script>
  </body>
</html>
