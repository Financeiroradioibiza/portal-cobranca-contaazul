<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview ícone — Chamados</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #eef4fb;
        margin: 0;
        padding: 2rem 1rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        color: #0c4a6e;
      }
      p {
        color: #475569;
        max-width: 28rem;
        margin: 0.5rem auto 1.5rem;
        font-size: 0.95rem;
      }
      .ios {
        display: inline-block;
        padding: 1.25rem;
        background: #fff;
        border-radius: 28px;
        box-shadow: 0 12px 40px rgba(15, 76, 129, 0.15);
      }
      .ios img {
        width: 120px;
        height: 120px;
        border-radius: 26px;
      }
      .raw img {
        width: min(280px, 90vw);
        height: auto;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <h1>Ícone Chamados — R + caixa de e-mail</h1>
    <p>No iPhone, o sistema arredonda as bordas automaticamente (simulação abaixo).</p>
    <div class="ios">
      <img src="/icon-app-preview.png" width="180" height="180" alt="Ícone arredondado estilo iOS" />
    </div>
    <div class="raw">
      <p>Arquivo quadrado (512 px) usado no PWA:</p>
      <img src="/icon-app-preview.png" alt="Preview 512px" />
    </div>
  </body>
</html>
