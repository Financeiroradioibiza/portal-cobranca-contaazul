# App Chamados — site Netlify SEPARADO do portal
# Domínio: https://chamados.radioibiza.app.br
# Dados: APIs do portal (proxy same-origin no browser)
#
# Painel Netlify: site novo, base directory = sites/chamados-app
# Desativar plugin Next.js (site estático).

[build]
  publish = "public"
  command = ""

[build.environment]
  NODE_VERSION = "22"
  CHAMADOS_APP_PORTAL_ORIGIN = "https://portal.radioibiza.app.br"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/login.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[redirects]]
  from = "/api/chamados-app/*"
  to = "https://portal.radioibiza.app.br/api/chamados-app/:splat"
  status = 200
  force = true
  headers = {X-Chamados-App-Proxy = "1"}

[[redirects]]
  from = "/api/auth/*"
  to = "https://portal.radioibiza.app.br/api/auth/:splat"
  status = 200
  force = true
  headers = {X-Chamados-App-Proxy = "1"}

[[redirects]]
  from = "/api/chamados"
  to = "https://portal.radioibiza.app.br/api/chamados"
  status = 200
  force = true
  headers = {X-Chamados-App-Proxy = "1"}

[[redirects]]
  from = "/api/chamados/*"
  to = "https://portal.radioibiza.app.br/api/chamados/:splat"
  status = 200
  force = true
  headers = {X-Chamados-App-Proxy = "1"}

[[redirects]]
  from = "/api/push/*"
  to = "https://portal.radioibiza.app.br/api/push/:splat"
  status = 200
  force = true
  headers = {X-Chamados-App-Proxy = "1"}

[[redirects]]
  from = "/api/config/users/*"
  to = "https://portal.radioibiza.app.br/api/config/users/:splat"
  status = 200
  force = true
  headers = {X-Chamados-App-Proxy = "1"}

[[redirects]]
  from = "/api/suporte/*"
  to = "https://portal.radioibiza.app.br/api/suporte/:splat"
  status = 200
  force = true
  headers = {X-Chamados-App-Proxy = "1"}

[[redirects]]
  from = "/api/producao/*"
  to = "https://portal.radioibiza.app.br/api/producao/:splat"
  status = 200
  force = true
  headers = {X-Chamados-App-Proxy = "1"}

[[redirects]]
  from = "/api/criacao/*"
  to = "https://portal.radioibiza.app.br/api/criacao/:splat"
  status = 200
  force = true
  headers = {X-Chamados-App-Proxy = "1"}

[[redirects]]
  from = "/api/contaazul/*"
  to = "https://portal.radioibiza.app.br/api/contaazul/:splat"
  status = 200
  force = true
  headers = {X-Chamados-App-Proxy = "1"}

[[redirects]]
  from = "/_next/*"
  to = "https://portal.radioibiza.app.br/_next/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/m"
  to = "https://portal.radioibiza.app.br/m"
  status = 200
  force = true
  headers = {X-Chamados-App-Proxy = "1"}

[[redirects]]
  from = "/m/*"
  to = "https://portal.radioibiza.app.br/m/:splat"
  status = 200
  force = true
  headers = {X-Chamados-App-Proxy = "1"}

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/app.html"
  status = 200
